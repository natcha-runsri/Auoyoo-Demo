# build เดโม (ข้อมูลจำลอง ไม่มี backend) แล้ว deploy ขึ้น GitHub Pages
# ตั้งค่าใน repo: Settings -> Pages -> Source = GitHub Actions
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # ng build --configuration demo --base-href "/Auoyoo-Demo/" + คัดลอก index.html เป็น 404.html (SPA fallback)
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
